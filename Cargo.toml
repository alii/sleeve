[workspace]
members = ["crates/*"]
resolver = "3"

# The crates under crates/ read and write rekordbox libraries, play audio and export to USB
# sticks. They started as part of RBXport (https://github.com/chrisle/rbxport) and live here
# now so Sleeve can change them freely. These settings are theirs.
[workspace.package]
version = "1.10.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
inefficient_to_string = "deny"
unnecessary_to_owned = "deny"
implicit_clone = "deny"
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

[package]
name = "sleeve"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "A fast, good-looking app for your rekordbox library."
repository = "https://github.com/alii/sleeve"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69", features = ["native-file-dialog"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5fd9bfa2ec89e6325d6435d95066336d93369d69" }
rbl-core = { path = "crates/rbl-core" }
rbl-db = { path = "crates/rbl-db" }
rbl-index = { path = "crates/rbl-index" }
rbl-anlz = { path = "crates/rbl-anlz" }
rbl-audio = { path = "crates/rbl-audio" }
rbl-analysis = { path = "crates/rbl-analysis" }
rbl-export = { path = "crates/rbl-export" }
rbl-devices = { path = "crates/rbl-devices" }
rbl-deck = { path = "crates/rbl-deck" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

# For updates: asks GitHub for the latest release and downloads it, over the system's own TLS
# (Security.framework on a Mac, SChannel on Windows) and its own trusted certificates.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# Checks a download against the SHA-256 GitHub lists for it.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Finds the AppData folders. Already built for rbl-core.
dirs = "5"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

# For build.rs, which turns assets/AppIcon.icon into the Windows exe's icon. Only the build
# script uses them; none of it goes into Sleeve itself.
[build-dependencies]
embed-resource = "3.0.12"
# Shapes and gradients are all the icon has, so no text, fonts or bitmaps.
resvg = { version = "0.49.0", default-features = false }
serde_json = "1.0.154"
